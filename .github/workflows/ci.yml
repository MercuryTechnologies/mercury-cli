name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/MercuryTechnologies/mercury-go,github.com/MercuryTechnologies/mercury-go-staging

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          go-sdk-app-private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_APP_PRIVATE_KEY }}

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          go-sdk-app-private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_APP_PRIVATE_KEY }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          go-sdk-app-private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_APP_PRIVATE_KEY }}

      - name: Run tests
        run: ./scripts/test

  nix:
    timeout-minutes: 15
    name: nix build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Mint GitHub App token for pushing the vendorHash fix
        # See: https://github.com/organizations/MercuryTechnologies/settings/apps/mercury-openapi-sync-stainless-cli
        # Push events only
        id: app-token
        if: github.event_name == 'push' && github.repository == 'MercuryTechnologies/mercury-cli-staging'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "Iv23lidIPoT2oBJKuwto" # Mercury OpenAPI Sync (Stainless CLI)
          private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_APP_PRIVATE_KEY }}
          owner: MercuryTechnologies
          repositories: mercury-cli-staging

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build flake
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          nix build .#default --print-build-logs 2>&1 | tee build.log

      # A `mercury-go` bump from Stainless changes go.mod/go.sum, which invalidates the
      # vendored module tree that `vendorHash` pins. Rewrite it to the hash nix computed,
      # prove the flake builds with it, then push the one-line fix back to the branch.
      - name: Update stale vendorHash
        id: vendor-hash
        if: steps.build.outcome == 'failure'
        run: |
          set -euo pipefail

          if ! grep -q "hash mismatch in fixed-output derivation" build.log; then
            echo "::error::nix build failed for a reason other than a vendorHash mismatch."
            exit 1
          fi

          NEW_HASH=$(grep -oE 'got:[[:space:]]+sha256-[A-Za-z0-9+/=]+' build.log | head -1 | awk '{print $NF}')
          if [ -z "$NEW_HASH" ]; then
            echo "::error::Detected a hash mismatch but could not parse the expected hash out of build.log."
            exit 1
          fi

          sed -i -E "s|vendorHash = \"sha256-[^\"]*\";|vendorHash = \"${NEW_HASH}\";|" flake.nix
          git diff --quiet -- flake.nix && {
            echo "::error::flake.nix already pins ${NEW_HASH}; the mismatch is not a stale hash."
            exit 1
          }

          echo "==> Rebuilding with vendorHash = ${NEW_HASH}"
          set -o pipefail
          nix build .#default --print-build-logs 2>&1 | tee rebuild.log

          echo "hash=${NEW_HASH}" >> "$GITHUB_OUTPUT"

      # Staging only, and only for branches in this repo. Everywhere else the
      # step below prints the hash and reds the job instead of committing.
      - name: Commit vendorHash fix
        id: vendor-hash-push
        if: >-
          steps.vendor-hash.outcome == 'success'
          && github.event_name == 'push'
          && github.repository == 'MercuryTechnologies/mercury-cli-staging'
        env:
          NEW_HASH: ${{ steps.vendor-hash.outputs.hash }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "update flake vendorHash after go.mod change" -- flake.nix
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
          {
            echo "## :white_check_mark: Updated stale flake \`vendorHash\`"
            echo ""
            echo "\`flake.nix\` now pins \`${NEW_HASH}\`, verified by a second \`nix build\`, and the fix was pushed to \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface vendorHash fix when it could not be pushed
        if: steps.vendor-hash.outcome == 'success' && steps.vendor-hash-push.outcome == 'skipped'
        env:
          NEW_HASH: ${{ steps.vendor-hash.outputs.hash }}
        run: |
          {
            echo "## :warning: Flake \`vendorHash\` is stale"
            echo ""
            echo "Go dependencies changed (likely a \`mercury-go\` bump from Stainless) but \`flake.nix\`'s \`vendorHash\` was not updated. CI cannot push to this ref, so apply it by hand:"
            echo ""
            echo '```nix'
            echo "vendorHash = \"${NEW_HASH}\";"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error file=flake.nix::vendorHash is stale — update to ${NEW_HASH}"
          exit 1

      - name: Fail if the flake never built
        if: steps.build.outcome == 'failure' && steps.vendor-hash.outcome != 'success'
        run: exit 1
