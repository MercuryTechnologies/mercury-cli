name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/MercuryTechnologies/mercury-go,github.com/MercuryTechnologies/mercury-go-staging

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          go-sdk-app-private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_APP_PRIVATE_KEY }}

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          go-sdk-app-private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_APP_PRIVATE_KEY }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          go-sdk-app-private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_APP_PRIVATE_KEY }}

      - name: Run tests
        run: ./scripts/test

  nix:
    timeout-minutes: 15
    name: nix build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build flake
        id: build
        run: |
          set -o pipefail
          nix build .#default --print-build-logs 2>&1 | tee build.log

      - name: Surface vendorHash fix on mismatch
        if: failure() && steps.build.outcome == 'failure'
        run: |
          if ! grep -q "hash mismatch in fixed-output derivation" build.log; then
            exit 0
          fi
          NEW_HASH=$(grep -oE 'got:[[:space:]]+sha256-[A-Za-z0-9+/=]+' build.log | head -1 | awk '{print $NF}')
          {
            echo "## :warning: Flake \`vendorHash\` is stale"
            echo ""
            echo "Go dependencies changed (likely a \`mercury-go\` bump from Stainless) but \`flake.nix\`'s \`vendorHash\` was not updated."
            echo ""
            echo "**Fix:** replace the \`vendorHash\` line in \`flake.nix\` with:"
            echo ""
            echo '```nix'
            echo "vendorHash = \"${NEW_HASH}\";"
            echo '```'
            echo ""
            echo "Commit the change and push; CI will re-run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error file=flake.nix::vendorHash is stale — update to ${NEW_HASH}"
