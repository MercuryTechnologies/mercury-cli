name: Promote SDKs

# Promote staging to production by fast-forwarding production `main` up to the
# staging trunk, preserving commit SHAs. Because the SHAs are preserved,
# production `main` and staging `main` stay identical and linear, the sealed
# custom-code commit stays an ancestor of both, and there is no divergence to
# heal on the next `stlc build`.
#
# Manual dispatch (workflow_dispatch): spec/codegen changes accumulate on
# staging `main`, and a maintainer promotes the batch in one fast-forward when
# ready to cut a release. Optionally gate each run behind a required-reviewer
# approval — see the `environment` note on the job below. release-please then
# opens its version/changelog PR on production on top.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  checks: read          # read staging's check runs before promoting

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.repository == 'MercuryTechnologies/mercury-cli-staging'
    # Optional: add required reviewers on each promote run before the fast-forward push.
    # With no reviewers it only scopes secrets/variables and adds no gate, so the manual dispatch
    # above is the only checkpoint. Remove this line if you don't use it.
    env:
      PRODUCTION_REPO: MercuryTechnologies/mercury-cli
    steps:
      - name: Check out staging
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint GitHub App token for the production repo
        # See: https://github.com/organizations/MercuryTechnologies/settings/apps/mercury-openapi-sync-stainless-cli
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "Iv23lidIPoT2oBJKuwto" # Mercury OpenAPI Sync (Stainless CLI)
          private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_APP_PRIVATE_KEY }}
          owner: MercuryTechnologies
          repositories: mercury-cli

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote add production \
            "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether production already has staging's content
        id: diff
        run: |
          # After a release, production carries release-please's version/changelog
          # commits that staging lacks. Ask whether merging staging into production
          # would change production's tree: if not, production already has staging's content.
          MERGED=$(git merge-tree --write-tree production/main origin/main) || MERGED=conflict
          PRODUCTION_TREE=$(git rev-parse 'production/main^{tree}')
          if [ "$MERGED" = "$PRODUCTION_TREE" ]; then
            echo "Production already contains staging's content. Nothing to promote."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require staging CI to be green on the commit being promoted
        # ci.yml's nix job fixes a stale flake `vendorHash` a few minutes after
        # a codegen push lands. Promoting before it finishes ships a broken
        # flake to production — and nix doesn't run there to catch it, so CI
        # stays green while `nix build github:.../mercury-cli` fails for
        # everyone. Worse, a release cut in that window tags it permanently.
        if: steps.diff.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse origin/main)
          echo "Checking staging CI on $sha"

          rows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "-")] | @tsv')

          if [ -z "$rows" ]; then
            echo "::error title=Promote blocked::No check runs on $sha — staging CI hasn't started. Wait for it, then re-run."
            exit 1
          fi

          pending=""; failed=""; nix_ok=false
          while IFS=$'\t' read -r name status conclusion; do
            printf '  %-28s %-12s %s\n' "$name" "$status" "$conclusion"
            if [ "$status" != completed ]; then
              pending="$pending $name"
              continue
            fi
            case "$conclusion" in
              # `skipped` is normal: the lint/build/test jobs opt out of
              # `codegen metadata` pushes and of non-fork PR events.
              success|skipped|neutral) ;;
              *) failed="$failed $name" ;;
            esac
            [ "$name" = "nix build" ] && [ "$conclusion" = success ] && nix_ok=true
          done <<< "$rows"

          if [ -n "$failed" ]; then
            echo "::error title=Promote blocked::Staging CI failed on $sha:$failed. Fix staging first."
            exit 1
          fi
          if [ -n "$pending" ]; then
            echo "::error title=Promote blocked::Staging CI still running on $sha:$pending. Wait for it to finish, then re-run."
            exit 1
          fi
          # Explicit: a *missing* nix run is the dangerous case, and an all-green
          # sweep of the other jobs would otherwise let it through.
          if [ "$nix_ok" != true ]; then
            echo "::error title=Promote blocked::The 'nix build' check has not succeeded on $sha, so flake.nix may still pin a stale vendorHash. Production does not run nix and would not catch it."
            exit 1
          fi
          echo "Staging CI is green on $sha — safe to promote."

      - name: Promote staging to production (fast-forward)
        if: steps.diff.outputs.synced == 'false'
        run: |
          # Refuse unless production/main is an ancestor of staging/main. If it
          # isn't, the trunks have forked (someone advanced production out of
          # band without back-syncing first) and a fast-forward is unsafe.
          if ! git merge-base --is-ancestor production/main origin/main; then
            echo "::error title=Promote blocked::production/main is not an ancestor of staging main. Back-sync production into staging first."
            exit 1
          fi
          git push production origin/main:refs/heads/main
          echo "Fast-forwarded production/main to staging/main."
