name: Setup Go
description: 'Sets up Go environment, authenticating against the private Go SDK repo and linking its matching branch on staging'
inputs:
  go-version:
    required: false
    description: version or version range of Go to use
  cache-dependency-path:
    required: false
    description: path to dependency files for caching
  go-sdk-app-private-key:
    required: false
    description: >-
      Private key for the "Mercury OpenAPI Sync (Stainless CLI)" GitHub App, used to read the
      private mercury-go-staging repo. Required on the staging repo; ignored elsewhere.
runs:
  using: composite
  steps:
    # On staging, the Go SDK lives in a private repo, so git needs credentials before
    # anything (the access check below, `go mod tidy`) touches github.com.
    - name: Mint GitHub App token for the private Go SDK repo
      # See: https://github.com/organizations/MercuryTechnologies/settings/apps/mercury-openapi-sync-stainless-cli
      if: github.repository == 'MercuryTechnologies/mercury-cli-staging'
      id: go-sdk-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: "Iv23lidIPoT2oBJKuwto" # Mercury OpenAPI Sync (Stainless CLI)
        private-key: ${{ inputs.go-sdk-app-private-key }}
        owner: MercuryTechnologies
        repositories: mercury-go-staging

    - name: Authenticate git for the private Go SDK repo
      if: github.repository == 'MercuryTechnologies/mercury-cli-staging'
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ steps.go-sdk-token.outputs.token }}@github.com/MercuryTechnologies/".insteadOf "https://github.com/MercuryTechnologies/"

    - name: Verify Go SDK module is accessible
      shell: bash
      env:
        GO_MODULE_REPO: ${{ github.repository == 'MercuryTechnologies/mercury-cli-staging' && 'MercuryTechnologies/mercury-go-staging' || 'MercuryTechnologies/mercury-go' }}
        GO_SDK_TOKEN: ${{ steps.go-sdk-token.outputs.token }}
      run: |
        # Run from outside the checkout. actions/checkout persists an
        # `http.https://github.com/.extraheader` Authorization for GITHUB_TOKEN (scoped to
        # this repo only) via an includeIf.gitdir entry; that header wins over the App
        # token embedded in our rewritten URL, so from inside the repo this check would
        # 404 on the private Go SDK repo. Fetches that `go` makes happen in the module
        # cache, outside the repo, so they are unaffected.
        cd "${RUNNER_TEMP}"
        if git ls-remote --exit-code "https://github.com/${GO_MODULE_REPO}" >/dev/null 2>&1; then
          exit 0
        fi
        echo "::error::Cannot access the Go SDK module at https://github.com/${GO_MODULE_REPO}."
        if [ -n "${GO_SDK_TOKEN:-}" ]; then
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GO_SDK_TOKEN}" \
            "https://api.github.com/repos/${GO_MODULE_REPO}")
          echo "::error::GitHub App token reached the repo API with HTTP ${STATUS} (200 = token is fine, so this is a git/credential problem; 403/404 = the App lacks Contents: read on ${GO_MODULE_REPO})."
        else
          echo "::error::No App token was minted. Pass 'go-sdk-app-private-key' to this action."
        fi
        exit 1

    - name: Setup go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ./go.mod
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # Build against the Go SDK branch matching this one. The module path stays
    # `mercury-go` (that is what mercury-go-staging's go.mod declares), so the rewrite
    # below is what redirects the fetch to the staging repo. `|| true` covers the Go SDK
    # not having a branch of this name, in which case we build against the pinned version.
    - name: Link staging branch
      if: github.repository == 'MercuryTechnologies/mercury-cli-staging'
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ steps.go-sdk-token.outputs.token }}@github.com/MercuryTechnologies/mercury-go-staging".insteadOf "https://github.com/MercuryTechnologies/mercury-go"
        ./scripts/link "github.com/MercuryTechnologies/mercury-go@${{ github.ref_name }}" || true

    - name: Bootstrap
      shell: bash
      run: ./scripts/bootstrap
